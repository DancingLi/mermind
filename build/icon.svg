<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="52%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nodeC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="64" y="64" width="896" height="896" rx="210"/>
    </clipPath>
  </defs>

  <!-- Rounded macOS-style squircle background -->
  <g clip-path="url(#squircleClip)">
    <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
    <circle cx="310" cy="270" r="300" fill="url(#glow)"/>
  </g>
  <rect x="70" y="70" width="884" height="884" rx="204" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5"/>

  <!-- Mindmap curved branches -->
  <g fill="none" stroke-linecap="round" stroke-width="28" opacity="0.92">
    <path d="M 380 512 C 495 512, 515 310, 676 300" stroke="#7DD3FC"/>
    <path d="M 380 512 C 510 512, 540 512, 692 512" stroke="#6EE7B7"/>
    <path d="M 380 512 C 495 512, 515 714, 676 724" stroke="#C4B5FD"/>
  </g>

  <!-- Root hub card -->
  <g filter="url(#shadow)">
    <rect x="190" y="424" width="218" height="176" rx="48" fill="url(#hub)"/>
    <!-- Stylized M glyph inside hub -->
    <path d="M 244 548 L 244 476 L 299 524 L 354 476 L 354 548" fill="none" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Satellite mindmap/flowchart nodes -->
  <g filter="url(#shadow)">
    <!-- Top rounded node -->
    <rect x="652" y="242" width="186" height="116" rx="34" fill="url(#nodeA)"/>
    <rect x="692" y="290" width="106" height="20" rx="10" fill="rgba(255,255,255,0.9)"/>

    <!-- Middle diamond/pill node -->
    <rect x="670" y="454" width="186" height="116" rx="58" fill="url(#nodeB)"/>
    <rect x="712" y="502" width="102" height="20" rx="10" fill="rgba(255,255,255,0.92)"/>

    <!-- Bottom rounded node -->
    <rect x="652" y="666" width="186" height="116" rx="34" fill="url(#nodeC)"/>
    <rect x="692" y="714" width="106" height="20" rx="10" fill="rgba(255,255,255,0.9)"/>
  </g>
</svg>
